name: Ratchet

# Performance ratchet: compare one measured run against `benchmarks/baseline.jsonl`
# and fail when a gated metric regresses past its tolerance.
#
# Scheduled and manual only. Timings move with the runner image, its CPU, and
# its neighbours, so gating every pull request on them produces failures that
# are about the machine, not the diff. `cargo test` stays the PR gate; this job
# is the periodic "did we get slower" question. See `benchmarks/README.md`.
permissions:
  contents: read

on:
  schedule:
    # Weekly, after the Monday CI run, so a red ratchet is investigated with
    # the same week's code state.
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ratchet
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  ratchet:
    name: Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The committed baseline was recorded on a developer machine, so timings
      # are advisory here until it is re-recorded on this runner image (see
      # "Re-recording the baseline" in benchmarks/README.md). Recall and
      # dists/query are hardware-independent and still fail the job.
      - name: Compare against the committed baseline
        run: >
          python3 scripts/ratchet.py
          --advisory-timing
          --save-current "$RUNNER_TEMP/ratchet-rows.jsonl"
      - name: Upload measured rows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-rows
          path: ${{ runner.temp }}/ratchet-rows.jsonl
          if-no-files-found: warn
          retention-days: 30
