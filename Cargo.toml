[package]
name = "vicinity"
version = "0.11.0"
authors = ["Arc <attobop@gmail.com>"]
edition = "2021"
rust-version = "1.89"
description = "Approximate nearest-neighbor search"
repository = "https://github.com/arclabs561/vicinity"
documentation = "https://docs.rs/vicinity"
license = "MIT OR Apache-2.0"
keywords = ["ann", "hnsw", "vector-search", "similarity", "nearest-neighbor"]
categories = ["algorithms", "science"]
exclude = ["data/", "benches/", "docs/", "scripts/", ".github/"]

[workspace]

[lib]
# `rlib` for normal Rust consumers; `cdylib` so maturin can build the PyO3
# extension module. maturin does not inject the cdylib target itself (it reports
# "No Cargo targets to build" without it), so the target must be declared here.
crate-type = ["rlib", "cdylib"]

[dependencies]
smallvec = "1.11"
rand = "0.9"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
thiserror = "2.0"

# Python bindings (feature-gated; used for ann-benchmarks integration)
# Note: do NOT enable `pyo3/extension-module` here. It breaks `cargo test --all-features`
# by disabling libpython linking for test binaries on macOS.
# Maturin sets `PYO3_BUILD_EXTENSION_MODULE=1` when building wheels.
#
# `abi3-py310` builds a stable-ABI wheel that works on CPython 3.10+, so one
# wheel per platform/arch covers every supported Python version. Caveat:
# abi3 wheels are not compatible with free-threaded CPython (3.13t+); revisit
# if/when free-threaded support is requested.
pyo3 = { version = "0.27.2", optional = true, features = ["abi3-py310"] }
numpy = { version = "0.27.0", optional = true }

# SIMD primitives (ecosystem crate)
innr = { version = "0.6", optional = true }

# Linear algebra for OPQ Procrustes solver (SVD)
nalgebra = { version = "0.33", optional = true, default-features = false, features = [
  "std",
] }

# Parallel batch search (feature-gated)
rayon = { version = "1.10", optional = true }

# ID compression primitives (ecosystem crate)
cnk = { version = "0.2.0", optional = true }

# Hierarchical clustering (EVoC)
clump = { version = "0.5.3", optional = true }

# Spectral statistics (optional).
rmt = { version = "0.1.3", optional = true }

# Sketching primitives (cross-polytope LSH, hyperplane hashing)
sketchir = { version = "0.3.1", optional = true }

# Vector quantization primitives (extracted from `vicinity`)
qntz = { package = "qntz", version = "0.2.1", optional = true, features = [
  "simd",
] }

# Persistence & IO (all optional, gated behind `persistence`)
postcard = { version = "1.0", optional = true, features = [
  "use-crc",
  "alloc",
  "use-std",
] }
durability = { version = "0.7.2", optional = true, features = ["mmap"] }
segstore = { version = "0.5", optional = true }


# RNG backend for wasm32 (rand -> getrandom needs a JS backend on wasm).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["hnsw", "innr"]
persistence = ["serde", "dep:postcard", "dep:durability"]
serde = ["dep:serde", "dep:serde_json", "smallvec/serde"]
hnsw = ["innr"]
# `store` adds an updatable, durable multi-segment ANN index (`store::UpdatableIndex`)
# via segstore.
store = ["hnsw", "serde", "dep:segstore", "dep:durability", "dep:postcard"]
# `cli` builds the `vicinity` binary (build + query an HNSW index from files).
cli = ["hnsw", "serde", "dep:clap"]
experimental = []
ivf_pq = [
  "dep:clump",
  "dep:nalgebra",
  "dep:serde",
  "dep:serde_json",
  "smallvec/serde",
]
diskann = ["dep:serde_json", "dep:durability"]
ivf_avq = ["dep:clump", "dep:serde", "dep:serde_json"]
sng = ["dep:serde", "dep:serde_json"]
fresh_graph = ["dep:serde", "dep:serde_json"]
curator = ["dep:serde", "dep:serde_json"]
emg = ["dep:serde", "dep:serde_json"]
range_filtered = ["hnsw", "dep:serde", "dep:serde_json"]
pipnn = ["dep:serde", "dep:serde_json"]
vamana = ["hnsw", "dep:serde", "dep:serde_json"]
quantization = ["qntz"]
benchmark = []
innr = ["dep:innr"]
parallel = ["dep:rayon"]
python = ["dep:pyo3", "dep:numpy", "hnsw", "ivf_pq", "persistence", "serde"]

# Feature names referenced by cfgs in the extracted code.
# These are currently mostly organizational toggles.
nsg = ["dep:serde", "dep:serde_json"]
finger = ["dep:serde", "dep:serde_json"]
filtered_graph = ["dep:serde", "dep:serde_json", "smallvec/serde"]
rp_quant = ["dep:serde", "dep:serde_json"]
sparse_mips = ["dep:serde", "dep:serde_json"]
lsh = ["dep:sketchir", "dep:serde", "dep:serde_json"]
nsw = ["dep:serde", "dep:serde_json"]
sq4 = ["serde"]
sq8 = ["serde"]
lemur = []
lemur-fixtures = ["lemur"]
kdtree = ["dep:serde", "dep:serde_json"]
balltree = ["dep:serde", "dep:serde_json"]
kmeans_tree = ["dep:serde", "dep:serde_json"]
rptree = ["dep:serde", "dep:serde_json"]
rmt-spectral = ["dep:rmt"]
evoc = ["dep:clump"]

id-compression = ["dep:cnk", "cnk/sbits", "cnk/ans"]
# Quantization sub-features (kept separate so callers can be explicit)
rabitq = ["qntz", "qntz/rabitq"]
ivf_rabitq = ["rabitq", "dep:clump", "dep:serde", "dep:serde_json", "hnsw"]
saq = ["qntz", "qntz/ternary"]
# Re-exported quantizers (from `qntz`)
qntz = ["dep:qntz"]
binary_index = ["dep:qntz", "qntz/binary", "dep:serde", "dep:serde_json"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
tempfile = "3"
anyhow = "1.0"
rankops = "0.1.5"

