# Every index family on one protocol. `required-features` lists every family
# the harness can drive; run it with `--features distance-stats` too when the
# baseline should carry `dists_per_query` (see `benchmarks/README.md`).
[[example]]
name = "inplace_construction"
path = "examples/inplace_construction.rs"
required-features = ["hnsw"]

[[example]]
name = "all_families"
path = "examples/all_families.rs"
required-features = [
  "hnsw",
  "nsw",
  "nsg",
  "finger",
  "fresh_graph",
  "filtered_graph",
  "vamana",
  "diskann",
  "ivf_pq",
  "ivf_avq",
  "ivf_rabitq",
  "emg",
  "curator",
  "lsh",
  "pipnn",
  "rp_quant",
  "sq4",
  "binary_index",
  "sng",
  "range_filtered",
  "kdtree",
  "balltree",
  "kmeans_tree",
  "rptree",
]

[[example]]
name = "rp_forest_search_k"
path = "examples/rp_forest_search_k.rs"
required-features = ["rptree"]

# Large-scale tier harness. Deliberately a sibling of `all_families`, not a
# mode of it: above 10M points the dataset must live on disk, ground truth is
# cached rather than recomputed, and the run needs resource guardrails. hnsw is
# the in-RAM graph and diskann is built from the same mapped rows then searched
# through its file-backed searcher, so the disk column is a real read path.
[[example]]
name = "large_scale"
path = "examples/large_scale.rs"
required-features = ["large-scale", "hnsw", "diskann"]

